[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscalai"
version = "0.1.0"
description = "Lean financial-statement extraction pipeline for European public companies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "openai>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "pymupdf>=1.25,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
# Browser-driven discovery (`fiscalai discover`). Kept optional so the core
# extraction pipeline stays lean; install with `pip install -e '.[browser]'`
# then `python -m playwright install chromium`.
browser = [
    "playwright>=1.40,<2",
]

[project.scripts]
fiscalai = "fiscalai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

